<div dir="rtl" style="font-family:Arial,sans-serif;background:#FFF7F3;padding:24px;color:#2B2140">
  <div style="max-width:460px;margin:0 auto;background:#ffffff;border-radius:20px;padding:28px;text-align:center">
    <h2 style="margin:0 0 8px">התחברות ל-Okeat</h2>
    <p style="margin:0 0 20px">לחצו על הכפתור כדי להתחבר, או הקלידו באתר את הקוד.</p>
    <p style="margin:0 0 20px">
      <a href="https://okeat.vercel.app/auth/confirm?token_hash={{ .TokenHash }}&type=email"
         style="background:#E36E57;color:#ffffff;padding:12px 28px;border-radius:999px;text-decoration:none;font-weight:bold;display:inline-block">כניסה ל-Okeat</a>
    </p>
    <p style="margin:0 0 6px;color:#7A6B88">הקוד שלכם:</p>
    <p dir="ltr" style="margin:0 0 20px;font-size:26px;font-weight:bold;letter-spacing:4px">{{ .Token }}</p>
    <p style="margin:0;color:#7A6B88;font-size:13px">לא ביקשתם להתחבר? אפשר להתעלם מהמייל הזה.</p>
  </div>
</div>
